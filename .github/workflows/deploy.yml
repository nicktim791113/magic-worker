name: Deploy to GitHub Pages

# 每次推送到 main 分支就自動建置並部署；也可以在 Actions 頁面手動觸發。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 給這個 workflow 部署 Pages 所需的權限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時間只跑一個部署，新的會取代排隊中的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true # 第一次部署時自動把這個儲存庫的 Pages 打開

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
